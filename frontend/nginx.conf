server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Interne App: nie in den Suchindex. add_header gilt nicht über Location-Grenzen hinweg, daher unten wiederholt.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # OAuth-Metadaten für den MCP-Server (Claude.ai-Connectoren): liegen am Wurzelpfad, die Antwort kommt vom Backend.
    # Variable + resolver, damit nginx auch startet, wenn das Backend gerade nicht erreichbar ist.
    location ^~ /.well-known/oauth- {
        resolver 127.0.0.11 valid=10s;
        set $tab_backend tab-backend:8000;
        proxy_pass http://$tab_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alles andere unter /.well-known gibt es nicht — kein index.html mit 200 zurückgeben.
    location ^~ /.well-known/ {
        return 404;
    }

    # Die Hülle nie aus dem Cache: nur so merkt die App nach einem Release, dass es eine neue Version gibt
    # (components/NeueVersion.jsx). Die Skripte selbst tragen einen Hash im Namen und dürfen lange liegen.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
